    <svg class="defs" aria-hidden="true" focusable="false">
      <defs>
        <filter id="ink-print" x="-4%" y="-12%" width="108%" height="124%" color-interpolation-filters="sRGB">
          <feTurbulence type="fractalNoise" baseFrequency="1.15" numOctaves="2" seed="12" result="n" />
          <feDisplacementMap in="SourceGraphic" in2="n" scale="0.8" xChannelSelector="R" yChannelSelector="G" result="d" />
          <feGaussianBlur in="d" stdDeviation="0.34" result="b" />
          <feComponentTransfer in="b"><feFuncA type="linear" slope="1.5" intercept="-0.08" /></feComponentTransfer>
        </filter>
      </defs>
    </svg>

    <a class="skip" href="#main">Skip to content</a>

    <main id="main" class="lost">
      <div class="wrap">
        <p class="tape tape--b"><span class="sr">404</span><span aria-hidden="true"><span class="tape__c">4</span><span class="tape__c">0</span><span class="tape__c">4</span></span></p>
