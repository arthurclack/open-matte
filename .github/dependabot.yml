# Dependabot proposes updates to the npm packages, the Docker images Open
# Matte is built on and the GitHub Actions its tests run, once a week. A new
# release waits a week before it's proposed, so a compromised one has time to
# be found and withdrawn first.
# Security alerts are separate: turn on Dependabot alerts in the repository's
# settings, under Code security.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  # The Dockerfile's node image. Only updates within its major version: moving to
  # the next long-term support line (an even number, every October) is done by
  # hand. Odd-numbered majors are never long-term, and the cooldown can even make
  # Dependabot offer one that has reached its end of life.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
  # deploy/compose.yml's caddy image.
  - package-ecosystem: docker-compose
    directory: /deploy
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  # The actions .github/workflows/tests.yml runs, pinned to commits.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
